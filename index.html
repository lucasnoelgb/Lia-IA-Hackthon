<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lia — Palavra Geradora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#F5F2EA;--card:#FFFFFF;--ink:#14223A;--soft:#52607A;--line:#E1DBCB;--blue:#1763AE;--teal:#0B8283;--green:#2D8F57;--leaf:#5FBF72;--orange:#FF8B3D;--oink:#B4500A;--tint:#E6F1F8;--g:linear-gradient(135deg,#1763AE 0%,#0B8283 58%,#2D8F57 100%);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#0F1826;--card:#18253A;--ink:#EEF3F8;--soft:#AAB8CA;--line:#2A3B54;--tint:#1E3350;--oink:#FFB070;--blue:#6DB6F0;--green:#7FD08F;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#0F1826;--card:#18253A;--ink:#EEF3F8;--soft:#AAB8CA;--line:#2A3B54;--tint:#1E3350;--oink:#FFB070;--blue:#6DB6F0;--green:#7FD08F;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:#CFD8DF;color:var(--ink);font-family:'Atkinson Hyperlegible',system-ui,sans-serif;font-size:20px;line-height:1.5}
h1,h2,h3,.pf{font-family:'Bricolage Grotesque','Atkinson Hyperlegible',system-ui,sans-serif;letter-spacing:-.01em}
#app{max-width:440px;height:100%;margin:0 auto;background:var(--paper);position:relative;overflow:hidden;display:flex;flex-direction:column}
@media(min-width:500px){#app{height:min(100%,880px);margin:auto;border-radius:36px;box-shadow:0 24px 70px rgba(20,34,58,.3)}body{display:flex;align-items:center}}
.screen{flex:1;overflow-y:auto;padding:20px 20px 120px;display:flex;flex-direction:column;gap:20px}
#app.nonav .screen{padding-bottom:28px}
h1{font-size:32px;line-height:1.1;font-weight:800;margin:0}h2{font-size:22px;font-weight:700;margin:0}h3{font-size:18px;margin:0}p{margin:0}
.soft{color:var(--soft)}.lab{font-size:17px;font-weight:700}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:4px solid var(--orange);outline-offset:3px}
.ic{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.logo{height:42px;width:auto;display:block}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo,:root:not([data-theme="light"]) .wlogo{background:#fff;padding:6px 12px;border-radius:14px}}
:root[data-theme="dark"] .logo,:root[data-theme="dark"] .wlogo{background:#fff;padding:6px 12px;border-radius:14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--tint);color:var(--blue);border-radius:999px;padding:3px 14px;font-weight:700;font-size:16px}
.cta{min-height:64px;border-radius:22px;background:var(--g);color:#fff;font-weight:700;font-size:21px;padding:12px 22px;width:100%;display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .15s}
.cta:active{transform:scale(.97)}.cta.white{background:#fff;color:#14223A}
.ghost{min-height:56px;border-radius:20px;border:2px solid var(--line);background:var(--card);font-weight:700;padding:8px 18px;width:100%;display:flex;align-items:center;justify-content:center;gap:10px}
.back{width:52px;height:52px;border-radius:50%;background:var(--card);border:2px solid var(--line);display:flex;align-items:center;justify-content:center}
.row{display:flex;gap:12px;align-items:center}
.field{width:100%;min-height:64px;border-radius:20px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:24px;padding:8px 18px}
.bar{display:flex;gap:6px}.bar i{flex:1;height:8px;border-radius:6px;background:var(--line)}.bar i.on{background:var(--g)}
.opt{width:100%;min-height:72px;border-radius:22px;background:var(--card);border:2px solid var(--line);font-size:21px;font-weight:700;display:flex;align-items:center;gap:16px;padding:10px 16px;text-align:left;transition:transform .15s,border-color .15s}
.opt:active{transform:scale(.98);border-color:var(--blue)}
.chip{width:48px;height:48px;border-radius:16px;background:var(--tint);color:var(--blue);display:flex;align-items:center;justify-content:center;flex:none}
.av{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;color:#fff;flex:none}
.avs{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.avs button{aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;border:4px solid transparent}
.avs button.on{border-color:var(--orange)}
.hero{position:relative;overflow:hidden;border-radius:34px;padding:24px 22px;color:#fff;background:radial-gradient(circle at 92% 6%,rgba(255,139,61,.95),transparent 38%),var(--g);display:flex;flex-direction:column;gap:16px}
.hero small{font-size:16px;opacity:.92}.hero .goalh{font-size:30px;line-height:1.12;font-weight:800}
.lia{display:flex;align-items:center;gap:14px}
.play{width:68px;height:68px;border-radius:50%;background:#fff;color:#14223A;display:flex;align-items:center;justify-content:center;flex:none}
.aura{display:flex;gap:4px;align-items:center;height:32px;margin-top:2px}.aura i{width:5px;height:8px;border-radius:3px;background:#fff;opacity:.75}
.aura.on i{animation:wv 1s ease-in-out infinite}.aura i:nth-child(2){animation-delay:.15s}.aura i:nth-child(3){animation-delay:.3s}.aura i:nth-child(4){animation-delay:.45s}.aura i:nth-child(5){animation-delay:.6s}
@keyframes wv{50%{height:30px}}
.who{display:flex;align-items:center;gap:12px}.who small{display:block;font-size:15px;color:var(--soft);line-height:1}.who b{font-size:24px}
.streak{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:700}.streak .ic{color:var(--orange);width:22px;height:22px}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
.dy{display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:700;font-size:16px;color:var(--soft)}
.dy i{width:100%;max-width:46px;aspect-ratio:1;border-radius:50%;border:2px dashed var(--line);display:flex;align-items:center;justify-content:center}
.dy i .ic{width:20px;height:20px}.dy.on i{background:var(--green);border:2px solid var(--green);color:#fff}.dy.td{color:var(--ink)}.dy.td i{border:3px solid var(--orange)}.dy.on.td i{border-color:var(--green);box-shadow:0 0 0 3px var(--orange)}
.meter{height:14px;border-radius:8px;background:var(--line);overflow:hidden;margin:10px 0}.meter i{display:block;height:100%;border-radius:8px;background:var(--g)}
.line{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.tx{background:none;color:var(--blue);font-weight:700;min-height:48px;padding:0 6px;display:inline-flex;align-items:center;gap:6px}
.gd{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:28px;padding:10px 18px 10px 8px;border:2px solid var(--line)}.gd svg{width:104px;height:88px;flex:none}
.wlogo{width:min(280px,76%);height:auto;margin:0 auto;display:block}
.wp{border-radius:34px;padding:26px 24px;color:#fff;background:radial-gradient(circle at 90% 8%,rgba(255,139,61,.95),transparent 40%),var(--g);display:flex;flex-direction:column;gap:2px}
.wp b{font:800 40px/1.05 'Bricolage Grotesque',sans-serif}.wp b:nth-child(2){opacity:.82}.wp b:nth-child(3){opacity:.64}
.ben{display:flex;gap:14px;align-items:center;font-weight:700;font-size:19px}
.idc{border-radius:32px;padding:22px;color:#fff;background:radial-gradient(circle at 92% 4%,rgba(255,139,61,.95),transparent 40%),var(--g);display:flex;flex-direction:column;gap:14px}
.idc .r{display:flex;flex-direction:column;border-top:2px solid rgba(255,255,255,.35);padding-top:10px}.idc small{font-size:15px;opacity:.9}.idc b{font-size:22px;line-height:1.25}.key{font:800 28px 'Bricolage Grotesque',sans-serif;letter-spacing:.08em}
.sum{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}.sum .n{font-size:56px;font-weight:800;line-height:.9}.sum .n small{font-size:24px;color:var(--soft)}
.today{display:flex;align-items:center;gap:14px;background:var(--card);border:2px solid var(--orange);border-radius:26px;padding:14px 16px;box-shadow:0 5px 0 var(--orange)}.today>div{flex:1;min-width:0}.today b{font:800 28px/1.1 'Bricolage Grotesque',sans-serif;display:block}.today small{font-size:16px;color:var(--soft)}
.today button{min-height:52px;border-radius:16px;background:var(--orange);color:#14223A;font-weight:700;padding:0 18px}
.road{position:relative;width:100%}.road svg{display:block;width:100%;height:auto}
.nd{position:absolute;width:0;height:0}
.dt{position:absolute;left:0;top:0;transform:translate(-50%,-50%);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;background:var(--g);font:800 22px 'Bricolage Grotesque',sans-serif;border:5px solid var(--paper)}
.dt.d{width:58px;height:58px;background:var(--green)}.dt.c{width:76px;height:76px;background:var(--orange);color:#14223A;animation:pulse 2s infinite;font-size:28px}.dt.l{width:52px;height:52px;background:var(--line);color:var(--soft)}.dt.t{width:64px;height:64px;background:linear-gradient(135deg,#FF8B3D,#F7C26B);color:#14223A}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,139,61,.55)}100%{box-shadow:0 0 0 18px rgba(255,139,61,0)}}
.lb{position:absolute;top:0;transform:translateY(-50%);width:128px;line-height:1.15;font:700 19px 'Bricolage Grotesque',sans-serif}.lb small{display:block;font:400 15px 'Atkinson Hyperlegible',sans-serif;color:var(--soft);margin-top:2px}
.lb.r{left:44px}.lb.lf{right:44px;text-align:right}.lb.l1{opacity:.7}
.hdr{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.bd{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px}
.bd b{font-size:16px;line-height:1.2}.bd small{font-size:14px;color:var(--soft)}
.bw{position:relative;width:92px;height:92px}.bw svg{position:absolute;inset:0;width:100%;height:100%}
.bw .tr{fill:none;stroke:var(--line);stroke-width:5}.bw .ar{fill:none;stroke:var(--green);stroke-width:5;stroke-linecap:round}
.seal{position:absolute;inset:11px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--tint);color:var(--blue)}
.bd.ok .seal{background:linear-gradient(135deg,var(--orange),#F7C26B);color:#14223A}.bd.lk{opacity:.5;filter:grayscale(1)}
.album{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.stamp{min-height:116px;border-radius:20px;border:3px dashed var(--green);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:8px;transform:rotate(-2deg)}
.stamp:nth-child(even){transform:rotate(2deg)}.stamp b{font:800 22px 'Bricolage Grotesque',sans-serif}.stamp small{font-size:15px;color:var(--soft)}.stamp .ic{color:var(--green);width:22px;height:22px}
.stamp.e{border-color:var(--line);color:var(--soft);background:transparent;transform:none}
.kv{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:2px solid var(--line)}.kv small{color:var(--soft);font-size:16px}.kv b{text-align:right}
.tile{width:150px;height:150px;border-radius:44px;background:var(--card);border:2px solid var(--line);margin:0 auto;display:flex;align-items:center;justify-content:center;font-size:84px;line-height:1}
.tile.sm{width:104px;height:104px;font-size:56px;border-radius:32px}
.word{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;font:800 48px 'Bricolage Grotesque',sans-serif}
.word span{padding:0 10px;border-radius:14px;transition:transform .25s cubic-bezier(.3,1.6,.5,1),background .2s;display:inline-block}
.word span.on{transform:scale(1.1);color:var(--oink);background:#FFE9D6}
:root[data-theme="dark"] .word span.on{background:#4A3220}
.msg{text-align:center;min-height:56px}
.slots,.pool{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.pool{min-height:84px}
.slot{min-width:78px;height:80px;border-radius:20px;border:3px dashed var(--line);display:flex;align-items:center;justify-content:center;font:800 32px 'Bricolage Grotesque',sans-serif}
.slot.f{border:3px solid var(--leaf);background:var(--card);color:var(--green);animation:snap .45s cubic-bezier(.3,1.8,.5,1)}
@keyframes snap{0%{transform:scale(1.3) translateY(-24px)}100%{transform:none}}
.piece{min-width:80px;height:80px;border-radius:22px;background:var(--g);color:#fff;font:800 32px 'Bricolage Grotesque',sans-serif;transition:transform .2s cubic-bezier(.3,1.6,.5,1)}
.piece:active{transform:translateY(-8px) scale(1.06)}.piece.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.syl{min-width:84px;height:84px;border-radius:22px;background:var(--card);border:3px solid var(--line);font:800 34px 'Bricolage Grotesque',sans-serif;transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.syl.on{border-color:var(--orange);background:#FFE9D6;color:var(--oink);transform:scale(1.1)}
nav{position:absolute;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:4px;padding:6px;border-radius:30px;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:2px solid var(--line);box-shadow:0 10px 30px rgba(20,34,58,.18);z-index:5}
#app.nonav nav{display:none}
nav button{flex:1;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:14px;font-weight:700;color:var(--soft);border-radius:24px;transition:background .2s,color .2s}
nav button.on{background:var(--ink);color:var(--paper)}
.conf{position:absolute;top:-20px;width:12px;height:16px;border-radius:50% 50% 50% 0;z-index:9;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(900px) rotate(540deg) translateX(var(--dx))}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== Motion + refinos (ui-ux-pro-max: Accessible & Ethical) ===== */
/* Bug: filhos com overflow:hidden (.hero) encolhiam em vez de rolar */
.screen>*{flex-shrink:0}
html.mo #scr.pre>*{opacity:0}
html.mo .rv{opacity:0}
html.mo .gl{opacity:0}
.field{transition:border-color .2s,box-shadow .2s}.field:focus{border-color:var(--blue);box-shadow:0 4px 0 var(--blue)}
.meter i{transform-origin:0 50%}
.mk{display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px 0 4px;border-top:2px solid var(--line)}
.mk svg{width:min(240px,72%);height:auto;overflow:visible;touch-action:manipulation}
.gl{transform-box:fill-box;transform-origin:50% 50%;cursor:pointer}.gl path{fill:url(#lg)}
.gl,.gl *{outline:none;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}.mk svg{-webkit-tap-highlight-color:transparent}.gl:focus-visible path{stroke:var(--orange);stroke-width:5;paint-order:stroke}

/* ===== Atmosfera e profundidade (claude-cookbooks: frontend_aesthetics, tema "solarpunk") ===== */
:root{--glow1:rgba(255,139,61,.16);--glow2:rgba(95,191,114,.16);--bd:#CFD8DF;--hl:1}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--glow1:rgba(255,139,61,.10);--glow2:rgba(95,191,114,.08);--bd:#0A111C;--hl:.55}}
:root[data-theme="dark"]{--glow1:rgba(255,139,61,.10);--glow2:rgba(95,191,114,.08);--bd:#0A111C;--hl:.55}
body{background:radial-gradient(60% 50% at 15% 20%,rgba(95,191,114,.35),transparent 70%),radial-gradient(50% 50% at 85% 80%,rgba(255,139,61,.28),transparent 70%),var(--bd)}
#app{background:radial-gradient(120% 55% at 100% 0%,var(--glow1),transparent 60%),radial-gradient(90% 45% at 0% 100%,var(--glow2),transparent 60%),var(--paper)}
#app::before{content:"";position:absolute;left:0;right:0;bottom:0;height:230px;background:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 440 230%22 preserveAspectRatio=%22none%22%3E%3Cpath d=%22M0 120C80 70 160 90 240 105S380 85 440 100V230H0Z%22 fill=%22%235FBF72%22 fill-opacity=%22.16%22/%3E%3Cpath d=%22M0 160C100 120 200 150 300 135S410 125 440 140V230H0Z%22 fill=%22%232D8F57%22 fill-opacity=%22.14%22/%3E%3Cpath d=%22M0 195C90 170 180 190 270 178S400 170 440 182V230H0Z%22 fill=%22%230B8283%22 fill-opacity=%22.12%22/%3E%3Cg fill=%22%23FF8B3D%22 fill-opacity=%22.5%22%3E%3Ccircle cx=%2258%22 cy=%22152%22 r=%223%22/%3E%3Ccircle cx=%22132%22 cy=%22170%22 r=%222.5%22/%3E%3Ccircle cx=%22318%22 cy=%22158%22 r=%223%22/%3E%3Ccircle cx=%22392%22 cy=%22150%22 r=%222.5%22/%3E%3C/g%3E%3C/svg%3E") bottom/100% 100% no-repeat;opacity:var(--hl);pointer-events:none;z-index:0}
.screen{position:relative;z-index:1}
.hero,.wp,.idc{position:relative;overflow:hidden;isolation:isolate}
.hero::before,.wp::before,.idc::before{content:"";position:absolute;z-index:-1;right:-70px;top:-70px;width:240px;height:240px;border-radius:50%;background:repeating-radial-gradient(circle,transparent 0 16px,rgba(255,255,255,.12) 16px 18px);pointer-events:none}
h1,h2,.goalh,.wp b{text-wrap:balance}

/* ===== Traçado ===== */
.tm{display:flex;align-items:center;justify-content:center;width:100%;height:clamp(88px,12vh,118px);border-radius:24px;background:var(--card,#fff);border:2px solid var(--line);color:var(--ink);font:800 clamp(72px,10.5vh,100px)/1 "Bricolage Grotesque","Atkinson Hyperlegible",system-ui,sans-serif;cursor:pointer}
.tm.hid span{visibility:hidden}
.tp{position:relative;flex:none;height:clamp(170px,26vh,260px);border-radius:24px;background:var(--card,#fff);border:2px dashed var(--line);overflow:hidden;color:var(--blue,#1763AE)}
.tp canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.tc{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tb{min-height:48px;font-size:16px;padding:0 6px;line-height:1.1}.tb:disabled{opacity:.45}.tb.on{background:var(--ink);color:var(--paper)}
.tdots{display:flex;gap:8px;justify-content:center}.tdots i{width:14px;height:14px;border-radius:50%;background:var(--line)}.tdots i.on{background:var(--orange)}.tdots i.ok{background:#2D8F57}
</style>
</head>
<body>
<div id="app" class="nonav"><div id="scr" class="screen"></div><nav id="nav" aria-label="Navegação principal"></nav></div>

try{const r=localStorage.getItem('lia');if(r)S={...S0,...JSON.parse(r)}}catch(e){}
const save=()=>{try{localStorage.setItem('lia',JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s),scr=$('#scr'),app=$('#app');
const name=()=>S.nick||'amigo';
const level=()=>Math.min(5,1+Math.floor(S.mastered.length/2));
const reason=()=>S.goal=='outros'&&S.custom?S.custom:GOALS[S.goal].m;
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const genKey=()=>'LIA-'+Array.from({length:5},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random()*32)]).join('');
const AV=[['sprout','#1763AE'],['star','#B4500A'],['flame','#B8352A'],['target','#0B8283'],['heart','#B03A6C'],['sun','#6B4FB5']];
const avatar=(i,sz=48)=>`<span class="av" style="width:${sz}px;height:${sz}px;background:${AV[i][1]}">${ic(AV[i][0]).replace('class="ic ','style="width:'+Math.round(sz*.55)+'px;height:'+Math.round(sz*.55)+'px" class="ic ')}</span>`;
const NAV=[['home','Início',()=>go(home,0)],['route','Jornada',()=>go(journey,1)],['learn','Aprender',()=>go(lesson,2)],['trophy','Conquistas',()=>go(bookScr,3)]];
$('#nav').innerHTML=NAV.map((n,i)=>`<button data-n="${i}">${ic(n[0])}<span>${n[1]}</span></button>`).join('');
document.querySelectorAll('#nav button').forEach(b=>{b.onclick=NAV[b.dataset.n][2]});
function go(fn,t=-1){stopVoice();app.classList.toggle('nonav',t<0);document.querySelectorAll('#nav button').forEach((b,i)=>{b.classList.toggle('on',i==t);i==t?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current')});fn();scr.scrollTop=0}
/* Voz da Lia (síntese do navegador, pt-BR) */
let voice=null;
function pick(){const v=speechSynthesis.getVoices().filter(x=>/pt[-_]BR/i.test(x.lang));voice=v.find(x=>/luciana|francisca|maria|google|female|feminina/i.test(x.name))||v[0]||null}
if('speechSynthesis' in window){pick();speechSynthesis.onvoiceschanged=pick}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function say(text,rate=.88,onstart){return new Promise(res=>{
 if(!('speechSynthesis' in window)){onstart&&onstart();return wait(600).then(res)}
 const u=new SpeechSynthesisUtterance(text);u.lang='pt-BR';u.rate=rate;u.pitch=1.1;if(voice)u.voice=voice;
 u.onstart=()=>onstart&&onstart();u.onend=res;u.onerror=res;speechSynthesis.speak(u)})}
function stopVoice(){cancel++;try{speechSynthesis.cancel()}catch(e){}document.querySelectorAll('.aura').forEach(a=>a.classList.remove('on'))}
async function liaSays(text,rate){const a=$('.aura');a&&a.classList.add('on');await say(text,rate);a&&a.classList.remove('on')}
function listen(cb){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){cb(null);return}
 const r=new R();r.lang='pt-BR';r.onresult=e=>cb(e.results[0][0].transcript);r.onerror=()=>cb(null);r.onnomatch=()=>cb(null);try{r.start()}catch(e){cb(null)}}
const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z]/g,'');
function nextWord(){const l=GOALS[S.goal].w;return l.find(w=>!S.mastered.includes(w[0]))||l[S.mastered.length%l.length]}
function confetti(){const c=['#1479B5','#5DBB6E','#F58A3C','#0E8A8F'];for(let i=0;i<26;i++){const d=document.createElement('i');d.className='conf';d.style.left=Math.random()*100+'%';d.style.background=c[i%4];d.style.setProperty('--dx',(Math.random()*120-60)+'px');d.style.animationDuration=(3+Math.random()*3)+'s';d.style.animationDelay=Math.random()*.6+'s';app.appendChild(d);setTimeout(()=>d.remove(),7000)}}

/* Boas-vindas */
function welcome(){go(()=>{scr.innerHTML=`<img class="wlogo" src="${LOGO}" alt="Lia">
 <div class="wp"><b>Ler.</b><b>Escrever.</b><b>Falar.</b><p style="margin-top:12px;font-size:20px">No seu ritmo, com a ajuda da Lia e com as palavras da sua vida.</p></div>
 <div style="display:flex;flex-direction:column;gap:14px">${[['shield','Sem e-mail, senha ou CPF'],['phone','Seus dados ficam só neste aparelho'],['vol','A Lia fala e ouve você']].map(a=>`<div class="ben"><span class="chip">${ic(a[0])}</span>${a[1]}</div>`).join('')}</div>
 <button class="cta" id="st" style="margin-top:auto">Criar meu perfil${ic('go')}</button>`;$('#st').onclick=()=>{step=0;other=false;go(onboarding)}},-1)}

/* Cadastro */
const Q=['Como você quer ser chamado?','Qual é o seu maior objetivo?','O que é mais difícil hoje?'];
function onboarding(){
 if(step==3)return card();
 const title=other?'Qual é o seu objetivo?':Q[step];let body='';
 if(step==0)body=`<label class="lab" for="nick">Seu nome ou apelido</label><input class="field" id="nick" autocomplete="off" value="${S.nick}"><button class="ghost" id="mic">${ic('mic')}Falar o meu nome</button><span class="lab">Escolha o seu símbolo</span><div class="avs">${AV.map((a,i)=>`<button data-a="${i}" class="${i==S.av?'on':''}" style="background:${a[1]}" aria-label="Símbolo ${i+1}">${ic(a[0]).replace('class="ic','style="color:#fff" class="ic')}</button>`).join('')}</div><button class="cta" id="ok">Continuar${ic('go')}</button>`;
 if(step==1&&!other)body=Object.entries(GOALS).map(([k,g])=>`<button class="opt" data-g="${k}"><span class="chip">${ic(g.i)}</span>${g.t}</button>`).join('');
 if(step==1&&other)body=`<label class="lab" for="oth">Conte com as suas palavras</label><input class="field" id="oth" autocomplete="off" placeholder="Ex.: ler cartas da minha irmã" value="${S.custom}"><button class="ghost" id="mic">${ic('mic')}Falar o meu objetivo</button><button class="cta" id="ok">Continuar${ic('go')}</button><button class="ghost" id="bk2">Voltar às opções</button>`;
 if(step==2)body=Object.entries(FOCI).map(([k,f])=>`<button class="opt" data-f="${k}"><span class="chip">${ic(f[0])}</span>${f[1]}</button>`).join('');
 scr.innerHTML=`<div class="top"><img class="logo" src="${LOGO}" alt="Lia"><span class="pill">Passo ${step+1} de 3</span></div>
 <div class="bar" aria-hidden="true">${[0,1,2].map(i=>`<i class="${i<=step?'on':''}"></i>`).join('')}</div>
 <h1>${title}</h1><button class="ghost" id="rep">${ic('vol')}Ouvir a pergunta</button>${body}`;
 const ask=()=>liaSays(step==0?'Oi! Eu sou a Lia. Como você quer ser chamado?':title,.85);
 $('#rep').onclick=ask;setTimeout(ask,350);
 const tgt=step==0?'#nick':'#oth';
 if($('#mic'))$('#mic').onclick=()=>listen(t=>{if(t)$(tgt).value=step==0?cap(t.split(' ')[0]):t;else liaSays('Não consegui ouvir. Você pode escrever.')});
 if(step==0){scr.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{S.av=+b.dataset.a;scr.querySelectorAll('[data-a]').forEach(x=>x.classList.toggle('on',x==b))});$('#ok').onclick=()=>{S.nick=$('#nick').value.trim();step=1;go(onboarding)}}
 if(step==1&&other){$('#ok').onclick=()=>{S.goal='outros';S.custom=$('#oth').value.trim();step=2;go(onboarding)};$('#bk2').onclick=()=>{other=false;go(onboarding)}}
 scr.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{if(b.dataset.g=='outros'){other=true;go(onboarding)}else{S.goal=b.dataset.g;S.custom='';step=2;go(onboarding)}});
 scr.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{S.focus=b.dataset.f;if(!S.key)S.key=genKey();save();step=3;go(onboarding)});
}
function card(){
 scr.innerHTML=`<div class="top"><img class="logo" src="${LOGO}" alt="Lia"><span class="pill">Perfil criado</span></div><h1>Seu cartão da Lia está pronto</h1>
 <div class="idc"><div class="row">${avatar(S.av,64)}<div><small>Aluno(a)</small><b style="font-size:28px;font-family:'Bricolage Grotesque'">${name()}</b></div></div>
 <div class="r"><small>Objetivo</small><b>${S.goal=='outros'&&S.custom?cap(S.custom):GOALS[S.goal].t}</b></div><div class="r"><small>Foco</small><b>${FOCI[S.focus][1]}</b></div><div class="r"><small>Chave anônima</small><span class="key">${S.key}</span></div></div>
 <p class="soft" style="font-size:17px">Essa chave identifica você neste aparelho. Não existe senha para esquecer.</p>
 <button class="cta" id="fin">Começar minha jornada${ic('go')}</button>`;
 $('#fin').onclick=()=>go(home,0);setTimeout(()=>liaSays(`Pronto, ${name()}! Seu cartão está criado. Vamos começar?`),300);
}

/* Início */
function garden(){const st=Math.min(5,Math.floor(S.wins/2));const h=14+st*14;const y=100-h;
 let lv='';for(let i=0;i<Math.min(st+1,5);i++){const ly=98-(i+1)*(h/(Math.min(st+1,5)+.4));const s=i%2?1:-1;lv+=`<ellipse cx="${100+s*16}" cy="${ly}" rx="16" ry="8" fill="${i%2?'var(--leaf)':'var(--teal)'}" transform="rotate(${s*-25} ${100+s*16} ${ly})"/>`}
 let fl=st>=3?`<circle cx="100" cy="${y}" r="${st>=5?15:11}" fill="var(--orange)"/><circle cx="100" cy="${y}" r="5" fill="#FFD36B"/>`:`<circle cx="100" cy="${y}" r="${st?6:4}" fill="var(--leaf)"/>`;
 return `<svg viewBox="0 20 200 110" role="img" aria-label="Jardim da vitória, fase ${st+1} de 6"><ellipse cx="100" cy="104" rx="56" ry="8" fill="var(--line)"/><path d="M100 102 L100 ${y}" stroke="var(--green)" stroke-width="6" stroke-linecap="round"/>${lv}${fl}</svg>`}
function week(){const h=S.hist||[],L='DSTQQSS';let o='';for(let k=6;k>=0;k--){const d=new Date();d.setDate(d.getDate()-k);const on=h.includes(d.toDateString());o+=`<div class="dy ${on?'on':''} ${k==0?'td':''}"><span>${L[d.getDay()]}</span><i>${on?ic('check'):''}</i></div>`}return o}
function home(){
 const g=GOALS[S.goal],done=g.w.filter(w=>S.mastered.includes(w[0])).length,n=g.w.length,cu=nextWord()[0],hl=(S.hist||[]).length;
 scr.innerHTML=`<div class="top"><div class="who">${avatar(S.av,52)}<div><small>Olá,</small><b class="pf">${name()}</b></div></div><span class="streak">${ic('flame')}${hl} ${hl==1?'dia':'dias'}</span></div>
 <section class="hero"><div><small>Seu objetivo</small><div class="goalh pf">${cap(reason())}</div></div>
  <div class="lia"><button class="play" id="vz" aria-label="Ouvir a mensagem da Lia">${ic('vol')}</button><div><b>Mensagem da Lia</b><span class="aura" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span></div></div>
  <button class="cta white" id="go">Continuar minha jornada${ic('go')}</button></section>
 <section><div class="hdr"><h2>Sua semana</h2><span class="soft" style="font-size:16px">${hl} ${hl==1?'dia':'dias'} de prática</span></div><div class="wk">${week()}</div></section>
 <section><div class="line"><h2>Sua jornada</h2><span class="pill">Nível ${level()}</span></div><div class="meter" role="progressbar" aria-valuemin="0" aria-valuemax="${n}" aria-valuenow="${done}"><i style="width:${done/n*100}%"></i></div>
  <div class="line"><span class="soft">${done} de ${n} palavras${done<n?` · próxima: <b style="color:var(--ink)">${!S.nameDone&&nameLetters().length?'o seu nome':cu}</b>`:''}</span><button class="tx" id="jn">Ver trilha${ic('go','')}</button></div></section>
 <div class="gd">${garden()}<div><b>Jardim da Vitória</b><p class="soft" style="font-size:16px">Cresce a cada tentativa, não só a cada acerto.</p></div></div>`;
 const msgs=[`${name()}, você apareceu hoje, e isso já é uma vitória. Vamos juntas: ${reason()}.`,`Cada tentativa faz o seu jardim crescer, ${name()}. Estou orgulhosa de você.`,`Devagar a gente chega longe, ${name()}. Hoje é mais um passo para ${reason()}.`];
 $('#vz').onclick=()=>liaSays(msgs[Math.floor(Math.random()*3)]);$('#go').onclick=()=>go(lesson,2);$('#jn').onclick=()=>go(journey,1);
}

/* Jornada */
function journey(){const g=GOALS[S.goal],cu=nextWord()[0],n=g.w.length,done=g.w.filter(w=>S.mastered.includes(w[0])).length,fin=done==n;
 const N=n+1,XS=[80,250,100,245,115,200],P=Array.from({length:N},(_,i)=>[XS[i%XS.length],70+i*120]),H=P[N-1][1]+70;
 let d=`M${P[0][0]} ${P[0][1]}`;for(let i=1;i<N;i++){const[a,b]=P[i-1],[c,e]=P[i];d+=` C${a} ${b+60} ${c} ${e-60} ${c} ${e}`}
 const cur_=g.w.find(w=>!S.mastered.includes(w[0]));
 const nodes=P.map((p,i)=>{const w=g.w[i],t=i==n,dn=!t&&S.mastered.includes(w[0]),c=!t&&!dn&&w[0]==cu&&!fin;const cls=t?'t':dn?'d':c?'c':'l';
  const inner=t?ic('trophy'):dn?ic('check'):c?i+1:ic('lock');const side=p[0]<170?'r':'lf';
  const lab=t?'Jornada concluída':w[0];const sub=t?(fin?'Parabéns!':'Meta final'):dn?'Conquistada':c?'Palavra de hoje':'Em breve';
  return `<div class="nd" style="left:${p[0]/340*100}%;top:${p[1]/H*100}%"><button class="dt ${cls}" data-i="${i}" aria-label="${lab}, ${sub}" ${cls=='l'||cls=='t'?'aria-disabled="true"':''}>${inner}</button><div class="lb ${side} ${cls=='l'?'l1':''}">${lab}<small>${sub}</small></div></div>`}).join('');
 scr.innerHTML=`<div class="sum"><div><h1>Minha jornada</h1><span class="soft">Para ${reason()}</span></div><div class="n pf">${done}<small>/${n}</small></div></div>
 <div class="meter" role="progressbar" aria-valuemin="0" aria-valuemax="${n}" aria-valuenow="${done}"><i style="width:${done/n*100}%"></i></div>
 ${fin?`<button class="ghost" id="cn">${ic('go')}Treinar de novo</button>`:`<div class="today"><div><small>Palavra de hoje · Nível ${level()}</small><b>${cur_[0]}</b></div><button id="cn">Começar</button></div>`}
 <div class="road"><svg viewBox="0 0 340 ${H}" aria-hidden="true"><defs><linearGradient id="rg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="${H}"><stop offset="0" stop-color="#1763AE"/><stop offset=".6" stop-color="#0B8283"/><stop offset="1" stop-color="#2D8F57"/></linearGradient></defs>
  <path d="${d}" fill="none" stroke="var(--line)" stroke-width="12" stroke-linecap="round" pathLength="100"/><path d="${d}" fill="none" stroke="url(#rg)" stroke-width="12" stroke-linecap="round" pathLength="100" stroke-dasharray="${(done/(N-1)*100).toFixed(1)} 200"/></svg>${nodes}</div>`;
 const c=$('#cn');if(c)c.onclick=()=>go(lesson,2);
 scr.querySelectorAll('.dt').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(i>=n)return;const w=g.w[i];if(b.classList.contains('c'))go(lesson,2);else if(b.classList.contains('d'))say(w[0].toLowerCase(),.8)});
}

/* Lição */
async function karaoke(w,sel){const my=++cancel;const els=[...document.querySelectorAll(sel)];
 for(let i=0;i<els.length;i++){if(my!==cancel)return;await say(w[1][i].toLowerCase(),.65,()=>els[i].classList.add('on'));await wait(120);els[i].classList.remove('on')}
 if(my===cancel)await say(w[0].toLowerCase(),.8)}
function lesson(){if(!S.nameDone&&nameLetters().length)return nameLesson();cur=nextWord();const f=S.focus;
 scr.innerHTML=`<div class="top"><h1>Palavra de hoje</h1><span class="pill">Nível ${level()}</span></div>
 <div class="tile" aria-hidden="true">${cur[2]}</div><div class="word">${cur[1].map(s=>`<span class="k">${s}</span>`).join('')}</div>
 <p class="msg soft">Esta é a palavra <b>${cur[0]}</b>. Toque para ouvir.</p>
 <button class="ghost" id="hear">${ic('vol')}Ouvir com a Lia</button>
 <button class="cta" id="pr">${f=='writing'?'Montar e escrever a palavra':f=='reading'?'Treinar a leitura':'Falar a palavra'}${ic('go')}</button>`;
 $('#hear').onclick=()=>karaoke(cur,'.k');$('#pr').onclick=()=>go(workshop,2);setTimeout(()=>karaoke(cur,'.k'),400);
}

/* Oficina */
function workshop(){const f=S.focus;
 if(f=='writing'){ex={placed:[],pool:[...cur[1]].map((t,i)=>({t,i})).sort(()=>Math.random()-.5)};return drawWrite()}
 return f=='reading'?drawRead():drawSpeak()}
const head=t=>`<div class="top"><button class="back" id="bk" aria-label="Voltar para a palavra">${ic('back')}</button><h2>${t}</h2><span style="width:52px"></span></div>`;
const lbk=()=>{$('#bk').onclick=()=>go(lesson,2)};
function drawWrite(){const w=cur[1];
 scr.innerHTML=`${head('Monte a palavra')}<div class="tile sm" aria-hidden="true">${cur[2]}</div>
 <div class="slots">${w.map((s,i)=>`<div class="slot ${ex.placed[i]?'f':''}">${ex.placed[i]||''}</div>`).join('')}</div>
 <p class="msg" id="m" aria-live="polite">Toque nas peças na ordem certa.</p>
 <div class="pool">${ex.pool.map(p=>`<button class="piece" data-i="${p.i}">${p.t}</button>`).join('')}</div>
 <button class="ghost" id="hear">${ic('vol')}Ouvir a palavra</button>`;
 lbk();$('#hear').onclick=()=>liaSays(cur[0].toLowerCase(),.75);
 scr.querySelectorAll('.piece').forEach(b=>b.onclick=()=>{const p=ex.pool.find(x=>x.i==b.dataset.i);
  if(p.t===w[ex.placed.length]){navigator.vibrate&&navigator.vibrate(20);ex.placed.push(p.t);ex.pool=ex.pool.filter(x=>x!==p);say(p.t.toLowerCase(),.7);ex.placed.length==w.length?wordTrace():drawWrite()}
  else{b.classList.add('shake');navigator.vibrate&&navigator.vibrate([10,40,10]);$('#m').textContent='Quase lá! Vamos juntas de novo?';liaSays('Quase lá! Vamos juntas de novo?');setTimeout(()=>b.classList.remove('shake'),450)}});
}
function drawRead(){
 scr.innerHTML=`${head('Vamos ler')}<div class="tile sm" aria-hidden="true">${cur[2]}</div>
 <div class="row" style="justify-content:center;flex-wrap:wrap">${cur[1].map((s,i)=>`<button class="syl" data-i="${i}">${s}</button>`).join('')}</div>
 <p class="msg soft">Toque em cada pedacinho para ouvir.</p>
 <button class="ghost" id="hear">${ic('vol')}Ler junto com a Lia</button><button class="cta" id="done">Eu li a palavra!</button>`;
 lbk();$('#hear').onclick=()=>karaoke(cur,'.syl');$('#done').onclick=win;
 scr.querySelectorAll('.syl').forEach(b=>b.onclick=()=>{b.classList.add('on');say(cur[1][b.dataset.i].toLowerCase(),.65).then(()=>b.classList.remove('on'))});
}
function drawSpeak(){
 scr.innerHTML=`${head('Vamos falar')}<div class="tile sm" aria-hidden="true">${cur[2]}</div><div class="word"><span>${cur[0]}</span></div>
 <p class="msg" id="m" aria-live="polite">A Lia fala primeiro. Depois é a sua vez.</p>
 <button class="cta" id="mic">${ic('mic')}Toque e fale</button>
 <button class="ghost" id="hear">${ic('vol')}Ouvir a Lia devagar</button><button class="ghost" id="done">Já falei</button>`;
 lbk();$('#hear').onclick=()=>liaSays(cur[1].join(' ').toLowerCase()+'. '+cur[0].toLowerCase(),.6);$('#done').onclick=win;setTimeout(()=>$('#hear').click(),300);
 $('#mic').onclick=()=>listen(t=>{if(t&&norm(t).includes(norm(cur[0])))win();else{$('#m').textContent='Quase lá! Vamos juntas de novo?';liaSays('Quase lá! Vamos juntas de novo?')}});
}
async function win(){stopVoice();confetti();navigator.vibrate&&navigator.vibrate([30,60,30]);
 const first=!S.mastered.includes(cur[0]);if(first)S.mastered.push(cur[0]);bump();save();
 const up=first&&S.mastered.length%2==0&&level()<5;
 scr.innerHTML=`<div class="tile" style="margin-top:24px" aria-hidden="true">${cur[2]}</div><div class="word"><span>${cur[0]}</span></div>
 <h1 style="text-align:center">Você conseguiu!</h1><p class="msg">${up?`Você subiu para o nível ${level()}.`:'Seu jardim cresceu um pouquinho.'}</p>
 <button class="cta" id="nx">Próxima palavra${ic('go')}</button><button class="ghost" id="hm">Ver minha jornada</button>`;
 $('#nx').onclick=()=>go(lesson,2);$('#hm').onclick=()=>go(journey,1);
 await liaSays(`${name()}, você conseguiu! Estou muito orgulhosa de você.`);
}

/* Conquistas */
function badges(){const g=GOALS[S.goal],d=g.w.filter(w=>S.mastered.includes(w[0])).length,hl=(S.hist||[]).length;
 return [['Primeira palavra','sprout',S.mastered.length,1],['Três palavras','medal',S.mastered.length,3],['Jornada completa','trophy',d,g.w.length],['Três dias','flame',hl,3],['Coragem','star',S.wins,5],['Nível 3','target',level(),3]]}
function badge(b){const p=Math.min(1,b[2]/b[3]),ok=p>=1,c=2*Math.PI*40,st=ok?'ok':b[2]>1&&p>0&&b[2]>0&&b[2]>=1&&p>0?'pr':'lk';const k=ok?'ok':b[2]>0?'pr':'lk';
 return `<div class="bd ${k}"><div class="bw"><svg viewBox="0 0 92 92" aria-hidden="true"><circle cx="46" cy="46" r="40" class="tr"/><circle cx="46" cy="46" r="40" class="ar" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${(c*(1-p)).toFixed(1)}" transform="rotate(-90 46 46)"/></svg><span class="seal">${ic(k=='lk'?'lock':b[1])}</span></div><b>${b[0]}</b><small>${ok?'Conquistada':k=='lk'?'Bloqueada':`${b[2]} de ${b[3]}`}</small></div>`}
function bookScr(){const g=GOALS[S.goal],all=Object.values(GOALS).flatMap(x=>x.w);const items=S.mastered.map(m=>all.find(w=>w[0]==m)).filter(Boolean);

/* ===== Traçado: letra-modelo em cima, folha embaixo. Mouse, toque e caneta (Pointer Events) ===== */
const LN={A:'a',B:'bê',C:'cê',D:'dê',E:'é',F:'éfe',G:'gê',H:'agá',I:'i',J:'jóta',K:'cá',L:'éle',M:'ême',N:'ene',O:'ó',P:'pê',Q:'quê',R:'érre',S:'ésse',T:'tê',U:'u',V:'vê',W:'dáblio',X:'xis',Y:'ípsilon',Z:'zê'};
const letterName=c=>(LN[c.normalize('NFD').replace(/[\u0300-\u036f]/g,'')]||c.toLowerCase())+(c=='Ç'?' cedilha':'');
const nameLetters=()=>[...((S.nick||'').trim().split(/\s+/)[0]||'').toUpperCase()].filter(c=>/\p{L}/u.test(c)).slice(0,12);
/* sequência diária + vitórias (usado por win e nameWin; apontado pelo graphify como lógica duplicada) */
function bump(){S.wins++;const t=new Date().toDateString();if(!(S.hist||[]).includes(t))S.hist=[...(S.hist||[]),t]}
let tr=null;
function nameLesson(){const L=nameLetters();tr={mode:'name',L,i:0,strokes:[],guide:true,model:true,warned:false,say:`${name()}, vamos começar pelo seu nome. Ele tem ${L.length} ${L.length==1?'letra':'letras'}. Vamos escrever uma de cada vez. A primeira letra é ${letterName(L[0])}. Passe o dedo por cima.`};drawTrace()}
/* Progressão: 1-2 palavras por sílaba (com guia) · depois palavra inteira · a partir da 5ª, sem guia (de memória) */
function wordTrace(){const syl=S.mastered.length<2&&cur[1].length>1,U=syl?cur[1].map(t=>t.toUpperCase()):[cur[0]];
 tr={mode:'word',L:U,i:0,strokes:[],guide:S.mastered.length<4,model:true,warned:false,say:`Agora vamos escrever a palavra ${cur[0].toLowerCase()}. ${syl?'Uma sílaba de cada vez. Primeiro: '+U[0].toLowerCase()+'.':'Escreva a palavra inteira, do seu jeito.'}`};drawTrace()}
function drawTrace(){const L=tr.L[tr.i],n=tr.L.length;
 scr.innerHTML=`${head(tr.mode=='name'?'Escreva o seu nome':'Escreva a palavra')}<div class="tdots" role="img" aria-label="Parte ${tr.i+1} de ${n}">${tr.L.map((l,k)=>`<i class="${k<tr.i?'ok':k==tr.i?'on':''}"></i>`).join('')}</div>
 <button class="tm" id="tm" aria-label="Ouvir ${L}"><span aria-hidden="true" style="font-size:calc(clamp(72px,10.5vh,100px) * ${Math.min(1,5/L.length).toFixed(2)})">${L}</span></button>
 <div class="tp" id="tp"><canvas id="cv" role="img" aria-label="Espaço para escrever ${L}. Use o dedo, o mouse ou a caneta."></canvas></div>

 <div class="tc"><button class="ghost tb" id="un">Desfazer</button><button class="ghost tb" id="cl">Apagar tudo</button><button class="ghost tb" id="gd"></button><button class="ghost tb" id="md"></button></div>
 <button class="cta" id="ok">${tr.i==n-1?(tr.mode=='name'?'Terminei meu nome!':'Terminei a palavra!'):'Pronto, próxima '+(tr.mode=='name'?'letra':'sílaba')}${ic('go')}</button>`;
 $('#bk').onclick=()=>go(home,0);
 const cv=$('#cv'),x=cv.getContext('2d'),pad=$('#tp'),FAM='"Bricolage Grotesque","Atkinson Hyperlegible",system-ui,sans-serif';let zz=0;const size=(c,w,h)=>{c.font='800 100px '+FAM;return Math.min(h*.78,100*w*.86/(c.measureText(L).width||100))};
 const lw=()=>Math.max(8,zz*.09);
 const gl=(c,w,h)=>{c.font='800 '+Math.round(size(c,w,h))+'px '+FAM;c.textAlign='center';c.textBaseline='middle';c.fillText(L,w/2,h*.54)};
 const paint=(c,w,h,k)=>{c.lineCap=c.lineJoin='round';c.lineWidth=lw()*k;tr.strokes.forEach(q=>{if(q.length==1){c.beginPath();c.arc(q[0][0]*w,q[0][1]*h,c.lineWidth/2,0,7);c.fill();return}c.beginPath();c.moveTo(q[0][0]*w,q[0][1]*h);for(let i=1;i<q.length-1;i++)c.quadraticCurveTo(q[i][0]*w,q[i][1]*h,(q[i][0]+q[i+1][0])/2*w,(q[i][1]+q[i+1][1])/2*h);const e=q[q.length-1];c.lineTo(e[0]*w,e[1]*h);c.stroke()})};
 const render=()=>{const w=cv.width,h=cv.height;x.clearRect(0,0,w,h);x.fillStyle=x.strokeStyle=getComputedStyle(cv).color;
  if(tr.guide){x.globalAlpha=.16;gl(x,w,h);x.globalAlpha=.6;x.setLineDash([8,10]);x.lineWidth=3;x.strokeText(L,w/2,h*.54);x.setLineDash([]);x.globalAlpha=1}
  paint(x,w,h,1)};
 const labels=()=>{$('#gd').textContent='Guia: '+(tr.guide?'ligada':'desligada');$('#gd').classList.toggle('on',tr.guide);$('#gd').setAttribute('aria-pressed',tr.guide);
  $('#md').textContent=tr.model?'Esconder modelo':'Mostrar modelo';$('#md').classList.toggle('on',!tr.model);$('#md').setAttribute('aria-pressed',!tr.model);$('#tm').classList.toggle('hid',!tr.model);
  $('#un').disabled=$('#cl').disabled=!tr.strokes.length};
 const fit=()=>{const d=Math.min(2,devicePixelRatio||1);cv.width=Math.max(1,Math.round(pad.clientWidth*d));cv.height=Math.max(1,Math.round(pad.clientHeight*d));zz=size(x,cv.width,cv.height);render()};
 new ResizeObserver(fit).observe(pad);document.fonts&&document.fonts.ready.then(fit);
 let live=null;const pt=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height]};

 $('#tm').onclick=()=>say(L.length==1?letterName(L):L.toLowerCase(),.7);
 $('#ok').onclick=()=>{const w=cv.width,h=cv.height;let cov=0,out=1;
  if(tr.strokes.length){const g=document.createElement('canvas'),k=document.createElement('canvas');g.width=k.width=w;g.height=k.height=h;const gc=g.getContext('2d'),kc=k.getContext('2d');gc.fillStyle=kc.fillStyle=kc.strokeStyle='#000';gl(gc,w,h);paint(kc,w,h,1.8);
   const a=gc.getImageData(0,0,w,h).data,b=kc.getImageData(0,0,w,h).data;let G=0,H=0,B=0,O=0;
   for(let i=3;i<a.length;i+=16){const ig=a[i]>100,is=b[i]>100;if(ig){G++;if(is)H++}if(is){B++;if(!ig)O++}}cov=G?H/G:0;out=B?O/B:1}
  const good=cov>=.5&&out<=.6;
  if(!good&&!tr.warned){tr.warned=true;const t=!tr.strokes.length?'Passe o dedo por cima do desenho. Pode começar!':cov<.5?'Quase! Tente passar por cima de tudo.':'Boa! Tente ficar mais perto do desenho.';$('#m').textContent=t;liaSays(t);navigator.vibrate&&navigator.vibrate([10,40,10]);return}
  navigator.vibrate&&navigator.vibrate(20);
  if(tr.i==n-1)return tr.mode=='name'?nameWin():win();
  tr.i++;tr.strokes=[];tr.warned=false;tr.say=`${good?['Muito bem!','Isso mesmo!','Ficou lindo!'][tr.i%3]:'Tudo bem, vamos para a próxima.'} Agora ${tr.mode=='name'?'a letra '+letterName(tr.L[tr.i]):'a sílaba '+tr.L[tr.i].toLowerCase()}.`;go(drawTrace,2)};
 labels();setTimeout(()=>liaSays(tr.say),350);
}

 scr.innerHTML=`<div class="word" style="margin-top:32px"><span>${tr.L.join('')}</span></div><h1 style="text-align:center">Você escreveu o seu nome!</h1><p class="msg">Esta é a sua primeira palavra, ${name()}.</p>

/* ===== Marca LIA: ideia do shutter-glyph-footer (21st), portada p/ vanilla. Toque na letra: vira e a Lia fala ===== */

/* ===== Motion (vanilla, via CDN). Sem Motion ou com "reduzir movimento": tudo aparece parado ===== */
scr.addEventListener('mousedown',e=>{if(e.target.closest&&e.target.closest('.gl'))e.preventDefault()});
const MO=window.Motion;
if(MO&&!matchMedia('(prefers-reduced-motion:reduce)').matches){
const { animate, inView, stagger } = MO;

const E=[.16,.84,.2,1];let cur_a=null;
const reveal=(sel,withY=true)=>scr.querySelectorAll(sel).forEach(el=>{
 el.classList.add('rv');
 inView(el,()=>{animate(el,withY?{opacity:[0,1],y:[18,0]}:{opacity:[0,1]},{duration:.55,ease:E}).then(()=>{el.classList.remove('rv');el.style.opacity='';el.style.transform=''})},{root:scr,amount:.3})});
function enter(){
 try{cur_a&&cur_a.cancel()}catch(e){}
 scr.classList.add('pre');const kids=[...scr.children];
 cur_a=animate(kids,{opacity:[0,1],y:[22,0]},{delay:stagger(.07),duration:.6,ease:E});
 cur_a.then(()=>{scr.classList.remove('pre');kids.forEach(k=>{k.style.opacity='';k.style.transform=''})});
 scr.querySelectorAll('.meter i').forEach(i=>animate(i,{scaleX:[0,1]},{duration:.9,delay:.35,ease:E}));

 if(p){const x=parseFloat(p.getAttribute('stroke-dasharray'))||0;p.setAttribute('stroke-dasharray','0 200');animate(0,x,{duration:1.1,delay:.3,ease:E,onUpdate:v=>p.setAttribute('stroke-dasharray',v.toFixed(1)+' 200')})}

 const mk=scr.querySelector('.mk');
 if(mk)inView(mk,()=>{mk.querySelectorAll('.gl').forEach((g,i)=>animate(0,1,{delay:i*.12,duration:.8,ease:E,onUpdate:v=>{g.style.opacity=v;g.style.transform='translateY('+(1-v)*50+'px)'}}).then(()=>{g.style.transform=''}))},{root:scr,amount:.5});
}
const _go=go;go=function(fn,t){_go(fn,t);enter()};
const _win=win;win=function(){const r=_win.apply(this,arguments);

const flipL=g=>{animate(0,1,{duration:.7,ease:E,onUpdate:v=>{g.style.transform='scaleY('+Math.cos(v*Math.PI*2)+')'}}).then(()=>{g.style.transform=''});say(g.dataset.s,.6)};
scr.addEventListener('click',e=>{const g=e.target.closest('.gl');g&&flipL(g)});
